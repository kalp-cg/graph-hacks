name: e2e

on:
  push:
    branches: [main]
  pull_request:

# Real end-to-end: browser -> Next.js -> FastAPI (+ WebSocket) -> MCP server -> FalkorDB. No mocks.
jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6380"
      LLM_PROVIDER: autopilot
      AUTOPILOT_DELAY_S: "0.2"
      NEXT_PUBLIC_API_URL: http://localhost:8100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m sentinel.seed --reset
          nohup uvicorn sentinel.api.main:app --port 8100 > api.log 2>&1 &
      - name: UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/static
          nohup env PORT=3001 node .next/standalone/server.js > ui.log 2>&1 &
      - name: Wait for both
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8100/api/health && curl -sf -o /dev/null localhost:3001 && exit 0; sleep 2; done
          exit 1
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs and report on failure
        if: failure()
        run: tail -100 backend/api.log frontend/ui.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
